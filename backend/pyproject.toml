[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "listmonk-backend"
version = "0.1.0"
description = "Listmonk backend rewritten in Python FastAPI"
requires-python = ">=3.12"
dependencies = [
    # Web framework
    "fastapi>=0.115.0",
    "uvicorn[standard]>=0.30.0",
    # Database
    "sqlalchemy[asyncio]>=2.0.0",
    "asyncpg>=0.29.0",
    "alembic>=1.13.0",
    "firebase-admin>=7.5.0",
    # Validation & settings
    "pydantic>=2.7.0",
    "pydantic-settings>=2.3.0",
    # Authentication
    "python-jose[cryptography]>=3.3.0",
    "passlib[bcrypt]>=1.7.4",
    "python-multipart>=0.0.9",
    # Email
    "aiosmtplib>=3.0.0",
    "jinja2>=3.1.0",
    "markdown>=3.6",
    # File uploads / S3
    "aiobotocore>=2.13.0",
    "aiofiles>=23.2.1",
    "pillow>=10.3.0",
    # TOTP / 2FA
    "pyotp>=2.9.0",
    "qrcode[pil]>=7.4.2",
    # Background tasks
    "arq>=0.25.0",
    # HTTP client (for OIDC, webhooks)
    "httpx>=0.27.0",
    # OIDC
    "authlib>=1.3.0",
    # Utilities
    "orjson>=3.10.0",
    "python-slugify>=8.0.4",
    "pytz>=2024.1",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.2.0",
    "pytest-asyncio>=0.23.0",
    "httpx>=0.27.0",
    "pytest-cov>=5.0.0",
    "ruff>=0.4.0",
    "mypy>=1.10.0",
]

[tool.hatch.build.targets.wheel]
packages = ["app"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.mypy]
python_version = "3.12"
strict = true
