[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "listmonk-backend"
version = "0.1.0"
description = "Listmonk backend rewritten in Python FastAPI"
requires-python = ">=3.12"
dependencies = [
    # Web framework
    "fastapi>=0.115.0",
    "uvicorn[standard]>=0.30.0",
    # Database
    "sqlalchemy[asyncio]>=2.0.0",
    "asyncpg>=0.29.0",
    "alembic>=1.13.0",
    # Validation & settings
    "pydantic>=2.7.0",
    "pydantic-settings>=2.3.0",
    # Authentication
    "python-jose[cryptography]>=3.3.0",
    "passlib[bcrypt]>=1.7.4",
    "python-multipart>=0.0.9",
    # Email
    "aiosmtplib>=3.0.0",
    "jinja2>=3.1.0",
    "markdown>=3.6",
    # File uploads / S3
    "aiobotocore>=2.13.0",
    "aiofiles>=23.2.1",
    "pillow>=10.3.0",
    # TOTP / 2FA
    "pyotp>=2.9.0",
    "qrcode[pil]>=7.4.2",
    # Background tasks
    "arq>=0.25.0",
    # HTTP client (for OIDC, webhooks)
    "httpx>=0.27.0",
    # OIDC
    "authlib>=1.3.0",
    # Utilities
    "orjson>=3.10.0",
    "python-slugify>=8.0.4",
    "pytz>=2024.1",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.2.0",
    "pytest-asyncio>=0.23.0",
    "httpx>=0.27.0",
    "pytest-cov>=5.0.0",
    "ruff>=0.4.0",
    "mypy>=1.10.0",
]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
# Pinned explicitly: ruff's implicit default set drifts between releases, which
# made the reported error count depend on whichever version you happened to have.
select = [
    "E", "W",   # pycodestyle
    "F",        # pyflakes
    "I",        # import sorting
    "UP",       # pyupgrade
    "B",        # bugbear
    "C4",       # comprehensions
    "SIM",      # simplify
    "DTZ",      # naive datetimes
    "BLE",      # blind except
    "S",        # bandit
    "RUF",
]
ignore = [
    "B008",  # FastAPI puts Depends()/Query()/Header() in argument defaults by design
    "S105",  # "possible hardcoded password" fires on token/permission name constants
    # `except Exception` at a request/worker/teardown boundary is deliberate here:
    # one bad row, template or mailbox must not take down the send loop or the
    # request. Every such site either logs or documents why it stays silent — if
    # you add one that does neither, that is the bug, not the bare Exception.
    "BLE001",
]

[tool.ruff.lint.per-file-ignores]
"test_*.py" = ["S101"]  # asserts are the point of a test
# tmpl.py is the HTML email renderer, so marking rendered content safe with
# Markup (S704) is its whole job. Its `if __name__ == "__main__"` block is an
# assert-based self-check for the Go->Jinja translator and never runs served.
"app/tmpl.py" = ["S101", "S704", "E501"]

[tool.mypy]
python_version = "3.12"
strict = true

# These ship no type information (no py.typed, no stubs on PyPI). Untyped at the
# boundary is the honest state; everything on our side of it is still checked.
[[tool.mypy.overrides]]
module = ["asyncpg.*", "aiofiles.*", "aiosmtplib.*", "qrcode.*", "markdown.*", "slugify.*"]
ignore_missing_imports = true
